<!-- La barre de navigation est incluse ici (composant personnalisé) -->
<navbar-element></navbar-element>

<!-- Petit espacement vertical sous la navbar -->
<div class="pt-4"></div>

<!-- Conteneur principal de la page -->
<main class="container py-4">

    <offer-element id="offer-element">

        <!-- Grille Bootstrap principale. g-5 ajoute un large espacement (gutter) entre les colonnes -->
        <div class="row g-5">

            <!-- SECTION GAUCHE (Contenu principal de l'annonce) - 8 colonnes sur grand écran -->
            <section class="col-lg-8">

                <div class="d-flex flex-wrap justify-content-between align-items-center mb-2">
                    <!-- Titre de l'annonce -->
                    <h1 class="offer-title fw-bolder mb-0"></h1>

                    <!-- Bouton d'édition (lien vers la page d'édition) -->
                    <a id="offer-edit-button" class="btn btn-outline-primary" style="display: none;">
                        <i class="bi bi-pencil-fill me-2"></i>
                        Modifier l'annonce
                    </a>
                </div>

                <!-- Badges pour la catégorie et le type d'offre -->
                <div class="mb-4">
                    <span class="offer-category badge bg-primary text-uppercase me-2">
                    </span>
                    <span class="offer-type badge bg-warning text-dark text-uppercase">
                    </span>
                </div>

                <!-- Carousel (diaporama d'images) de l'annonce -->
                <div class="carousel slide mb-5" data-bs-ride="carousel" id="offer-carousel">
                    <!-- Indicateurs (les petits points en bas) -->
                    <div class="carousel-indicators">
                        <button type="button" data-bs-target="#offer-carousel" data-bs-slide-to="0" class="active"
                            aria-current="true" aria-label="Slide 1"></button>
                        <button type="button" data-bs-target="#offer-carousel" data-bs-slide-to="1"
                            aria-label="Slide 2"></button>
                    </div>

                    <!-- Conteneur pour les images (slides) -->
                    <div id="offer-image-container" class="offer-pictures carousel-inner rounded-3 shadow-lg">
                        <!-- Slide 1 (active = visible au chargement) -->
                        <div class="carousel-item active">
                            <img src="https://placehold.co/800x450/33A366/ffffff?text=Image+1" class="d-block w-100"
                                alt="Image 1 de l'annonce">
                        </div>
                        <!-- Slide 2 -->
                        <div class="carousel-item">
                            <img src="https://placehold.co/800x450/33A366/ffffff?text=Image+2" class="d-block w-100"
                                alt="Image 2 de l'annonce">
                        </div>
                    </div>

                    <!-- Contrôles (flèches) Précédent/Suivant -->
                    <button class="carousel-control-prev" type="button" data-bs-target="#offer-carousel"
                        data-bs-slide="prev">
                        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Précédent</span>
                    </button>
                    <button class="carousel-control-next" type="button" data-bs-target="#offer-carousel"
                        data-bs-slide="next">
                        <span class="carousel-control-next-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Suivant</span>
                    </button>
                </div>

                <!-- Section Description -->
                <h3 class="border-bottom pb-2 mb-3 text-secondary">Description de l'Offre</h3>
                <p class="offer-description lead text-muted">
                    <!-- ? = Emplacement pour la description dynamique -->
                </p>

                <!-- Section "En échange de" -->
                <h3 class="border-bottom pb-2 mb-3 mt-5 text-secondary">Ce qui est demandé en Échange</h3>
                <!-- Carte stylisée pour mettre en avant la demande -->
                <div class="card border-warning mb-4">
                    <div class="card-body">
                        <i class="bi bi-info-circle-fill text-warning me-2"></i>
                        <!-- ? = Emplacement pour la demande d'échange dynamique -->
                        <p class="offer-exchange"></p>
                    </div>
                </div>

                <!-- Section Localisation -->
                <h3 class="border-bottom pb-2 mb-3 mt-5 text-secondary">Localisation</h3>
                <p class="mb-5">
                    <i class="offer-location bi bi-geo-alt-fill text-danger me-2"></i>
                </p>
            </section>

            <!-- SECTION DROITE (Barre latérale) - 4 colonnes sur grand écran -->
            <aside class="col-lg-4">

                <!-- Carte "Propriétaire" -->
                <div class="card mb-4 shadow-lg text-center p-3">
                    <div class="card-body">
                        <h4 class="card-title text-primary mb-3">Le Propriétaire</h4>

                        <!-- Composant personnalisé pour les infos utilisateur -->
                        <user-element id="offer-seller">
                            <!-- Avatar -->
                            <img alt="Vendeur" width="80" height="80"
                                class="user-avatar rounded-circle mb-3 border border-3 border-primary shadow">

                            <!-- Nom (dynamique) -->
                            <h5 class="user-name fw-bold mb-1">
                            </h5>
                            <!-- Note (dynamique) -->
                            <p class="user-rating mb-3 text-warning">
                            </p>
                            <!-- Lien vers le profil -->
                            <a class="user-profile-button btn btn-outline-primary w-100 mt-2">Voir le Profil</a>
                        </user-element>

                    </div>
                </div>

                <!-- Carte "Vos Conversations" (Pour le propriétaire) -->
                <div id="chat-list-card" style="display: none;" class="card shadow-lg border-info mb-4">
                    <div class="card-header bg-info text-white fw-bold">
                        <i class="bi bi-chat-dots-fill me-2"></i>
                        Vos Conversations
                    </div>
                    <div class="card-body p-0">
                        <!-- 'id="offer-chat-list"' pour y injecter vos chats -->
                        <div id="offer-chat-list" class="list-group list-group-flush"
                            style="max-height: 300px; overflow-y: auto;">
                        </div>
                    </div>
                </div>

                <!-- Carte "Proposer un Échange" (Formulaire) -->
                <div id="trade-card" style="display: none;" class="card shadow-lg border-success">
                    <div class="card-header bg-success text-white fw-bold">
                        Proposer un échange
                    </div>
                    <div class="card-body">
                        <form id="new-chat-form" is="new-chat-form">
                            <!-- Champ: Contre-proposition -->
                            <div class="mb-3">
                                <textarea name="message" class="form-control" rows="3" required
                                    placeholder="Ex: Je vous offre une heure de cours de cuisine..."></textarea>
                            </div>
                            <!-- Bouton d'envoi -->
                            <button type="submit" class="btn btn-success w-100 btn-lg mt-2">
                                Envoyer un message
                            </button>
                        </form>
                    </div>
                </div>
            </aside>
        </div>
    </offer-element>
</main>
